services:
  db:
    image: postgres:16-alpine
    container_name: next_betterauth_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: betterauth_monolith
    ports:
      - "5439:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d betterauth_monolith"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
